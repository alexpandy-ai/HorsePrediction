name: Publish racecards

# Automatic publishing is not active. Harvis does not run this job.
# After HARVIS_DEPLOY_TOKEN is stored in the repository secrets, uncomment the schedule.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 2 * * *" # 08:00 India time

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run indiarace:sync
      - run: npm run build
      - name: Deploy the static build to Harvis
        env:
          HARVIS_DEPLOY_TOKEN: ${{ secrets.HARVIS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$HARVIS_DEPLOY_TOKEN" ]; then
            echo "HARVIS_DEPLOY_TOKEN is not configured. The snapshot was built and was not published."
            exit 0
          fi
          npx harvis deploy dist
