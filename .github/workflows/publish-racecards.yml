name: Publish racecards

# Harvis only serves files. This job reads Indiarace and deploys the snapshot.
# Opening the website loads those files; it does not contact Indiarace.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *" # 08:00 India time
    - cron: "0 7 * * *" # 12:30 India time, before the usual first race

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run indiarace:sync
      - name: Import FormFav when a key is configured
        env:
          FORMFAV_API_KEY: ${{ secrets.FORMFAV_API_KEY }}
          FORMFAV_PLAN: ${{ secrets.FORMFAV_PLAN }}
          FORMFAV_PUBLISHED_BASE: https://horsepredictor.harvis.page
        run: npm run formfav:sync
      - run: npm run build
      - name: Deploy the static build to Harvis
        env:
          HARVIS_DEPLOY_TOKEN: ${{ secrets.HARVIS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$HARVIS_DEPLOY_TOKEN" ]; then
            echo "HARVIS_DEPLOY_TOKEN is not configured. The snapshot was built and was not published."
            exit 0
          fi
          npx harvis deploy dist
